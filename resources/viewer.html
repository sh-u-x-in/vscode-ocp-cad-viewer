<!-- ocp_vscode's webview. Static: nothing is substituted into this file.

     The two things it cannot know - where the extension put its resources, and
     what the user's settings say - arrive in an `init` message, because a
     webview URI is minted at runtime and a setting can change while the panel
     is open. That is also why the modules are imported dynamically: their URLs
     are in that message.

     The standalone viewer is resources/viewer-standalone.html, a Jinja template
     of its own. One file serving both hosts is what made every host-specific
     line something to inject from outside. -->
<html>
    <head>
        <meta charset="utf-8" />
        <title>OCP CAD Viewer</title>
        <link rel="icon" type="image/png" href="static/icon/ocp-eye.png" />
        <script type="module">
            const vscode = acquireVsCodeApi();

            // The page is ocp-viewer-core's, and so is everything it does. What
            // is left here is how this host starts: the extension is the only
            // one that knows where it put its resources and what the user's
            // settings say, so both arrive in an `init` message and the modules
            // are imported from the URLs in it.
            let page = null;
            let settings = null;

            function send(command, message) {
                vscode.postMessage({ command: command, text: message });
            }

            async function init(paths, values) {
                settings = values;
                console.log(
                    "[ocp-viewer] init: labels =",
                    settings.labels ? Object.keys(settings.labels).length : "none"
                );

                const style = document.createElement("link");
                style.rel = "stylesheet";
                style.href = paths.style;
                document.head.appendChild(style);

                const { Viewer, Display, Timer } = await import(paths.renderer);
                const { createPage } = await import(paths.core);

                // ocp-viewer-core assembles the Display options from a
                // hand-written field list (buildDisplayOptions), which has no
                // `labels` entry - a labels override inside
                // `overrides.display` would be silently dropped. Subclassing
                // re-injects the dictionary at construction time, after that
                // merge, where nothing can lose it.
                const LabeledDisplay =
                    settings.labels == null
                        ? Display
                        : class extends Display {
                              constructor(element, options) {
                                  super(element, { ...options, labels: settings.labels });
                              }
                          };

                page = createPage({
                    Viewer,
                    Display: LabeledDisplay,
                    Timer,
                    send,
                    theme: settings.theme,
                    // Only what this host differs on. Every number the renderer
                    // itself defines comes from the core, so two clients cannot
                    // drift apart on values neither of them chose.
                    overrides: {
                        display: {
                            treeWidth: settings.treeWidth,
                            glass: settings.glass,
                            tools: settings.tools,
                            theme: settings.theme,
                            zscaleTool: false
                        },
                        viewer: {
                            tools: settings.tools,
                            glass: settings.glass,
                            up: settings.up,
                            control: settings.control
                        }
                    }
                });

                page.showSplash({
                    theme: settings.theme,
                    treeWidth: settings.treeWidth,
                    keymap: settings.keymap
                });
            }

            window.addEventListener("message", (event) => {
                const data =
                    typeof event.data === "string" ? JSON.parse(event.data) : event.data;
                if (data.type === "init") {
                    init(data.paths, data.settings);
                }
            });

            // VS Code changes its colour theme under the webview by swapping a
            // class on the body, which is this host's alone to notice.
            const observer = new MutationObserver(() => {
                if (page == null) {
                    return;
                }
                page.setTheme(
                    settings.theme === "browser"
                        ? document.body.className === "vscode-light"
                            ? "light"
                            : "dark"
                        : settings.theme
                );
            });
            observer.observe(document.body, { attributes: true, attributeFilter: ["class"] });

            window.addEventListener("load", function () {
                setTimeout(() => {
                    send("started", {});
                }, 200);
            });
        </script>
    </head>

    <body style="padding: 0px; width: fit-content">
        <div id="cad_viewer"></div>
    </body>
</html>
